x-api-common: &api-common
  build: .
  env_file: .env
  volumes:
    - ./config:/app/config:ro
  healthcheck:
    test:
      - CMD
      - python
      - -c
      - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 10s

services:
  # ---------------------------------------------------------------------------
  # Shard A: accounts A0001-A1000, independent PostgreSQL instance.
  # ---------------------------------------------------------------------------
  db-a:
    image: postgres:16-alpine
    # Two-phase commit requires prepared transactions. The default is 0, which
    # silently rejects PREPARE TRANSACTION.
    command: ["postgres", "-c", "max_prepared_transactions=64"]
    environment:
      POSTGRES_DB: banking_a
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata-a:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d banking_a"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot schema migration for shard A. Runs before the A replicas start.
  migrate-a:
    build: .
    command: ["python", "manage.py", "migrate", "--noinput"]
    env_file: .env
    environment:
      DB_HOST: db-a
      DB_NAME: banking_a
      SHARD_ID: shard-a
      REPLICA_ID: shard-a-migrate
    volumes:
      - ./config:/app/config:ro
    depends_on:
      db-a:
        condition: service_healthy

  api-a1:
    <<: *api-common
    environment:
      DB_HOST: db-a
      DB_NAME: banking_a
      SHARD_ID: shard-a
      REPLICA_ID: shard-a-1
    expose:
      - "8000"
    # Published only so the DRF browsable API can be opened in a browser for
    # inspection. The banking client still uses the gateway exclusively.
    ports:
      - "8001:8000"
    depends_on:
      db-a:
        condition: service_healthy
      migrate-a:
        condition: service_completed_successfully

  api-a2:
    <<: *api-common
    environment:
      DB_HOST: db-a
      DB_NAME: banking_a
      SHARD_ID: shard-a
      REPLICA_ID: shard-a-2
    expose:
      - "8000"
    ports:
      - "8002:8000"
    depends_on:
      db-a:
        condition: service_healthy
      migrate-a:
        condition: service_completed_successfully

  # ---------------------------------------------------------------------------
  # Shard B: accounts A1001-A2000, independent PostgreSQL instance.
  # ---------------------------------------------------------------------------
  db-b:
    image: postgres:16-alpine
    # Two-phase commit requires prepared transactions. The default is 0, which
    # silently rejects PREPARE TRANSACTION.
    command: ["postgres", "-c", "max_prepared_transactions=64"]
    environment:
      POSTGRES_DB: banking_b
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata-b:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d banking_b"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate-b:
    build: .
    command: ["python", "manage.py", "migrate", "--noinput"]
    env_file: .env
    environment:
      DB_HOST: db-b
      DB_NAME: banking_b
      SHARD_ID: shard-b
      REPLICA_ID: shard-b-migrate
    volumes:
      - ./config:/app/config:ro
    depends_on:
      db-b:
        condition: service_healthy

  api-b1:
    <<: *api-common
    environment:
      DB_HOST: db-b
      DB_NAME: banking_b
      SHARD_ID: shard-b
      REPLICA_ID: shard-b-1
    expose:
      - "8000"
    ports:
      - "8003:8000"
    depends_on:
      db-b:
        condition: service_healthy
      migrate-b:
        condition: service_completed_successfully

  api-b2:
    <<: *api-common
    environment:
      DB_HOST: db-b
      DB_NAME: banking_b
      SHARD_ID: shard-b
      REPLICA_ID: shard-b-2
    expose:
      - "8000"
    ports:
      - "8004:8000"
    depends_on:
      db-b:
        condition: service_healthy
      migrate-b:
        condition: service_completed_successfully

  # ---------------------------------------------------------------------------
  # Coordinator decision log. Deliberately separate from both shards: a
  # recorded COMMIT must still be readable when a shard is down.
  # ---------------------------------------------------------------------------
  coord-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: banking_coord
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata-coord:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d banking_coord"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # Gateway: the only client-facing entry point. Resolves accounts to shards
  # and load-balances over healthy replicas of the owning shard. Also hosts
  # the 2PC coordinator; its decision log lives in coord-db.
  # ---------------------------------------------------------------------------
  gateway:
    build: ./gateway
    environment:
      CONFIG_DIR: /app/config
      COORD_DB_HOST: coord-db
      COORD_DB_PORT: "5432"
      COORD_DB_NAME: banking_coord
      COORD_DB_USER: ${DB_USER}
      COORD_DB_PASSWORD: ${DB_PASSWORD}
      COORD_RPC_TIMEOUT_SECONDS: ${COORD_RPC_TIMEOUT_SECONDS:-6}
      COORD_RPC_ATTEMPTS: ${COORD_RPC_ATTEMPTS:-2}
      COORD_RECOVERY_INTERVAL_SECONDS: ${COORD_RECOVERY_INTERVAL_SECONDS:-5}
      COORD_PREPARING_GRACE_SECONDS: ${COORD_PREPARING_GRACE_SECONDS:-12}
      COORD_TEST_PAUSE_AFTER_PREPARE_SECONDS: ${COORD_TEST_PAUSE_AFTER_PREPARE_SECONDS:-0}
      COORD_TEST_PAUSE_AFTER_DECISION_SECONDS: ${COORD_TEST_PAUSE_AFTER_DECISION_SECONDS:-0}
    volumes:
      - ./config:/app/config:ro
    ports:
      - "8000:8000"
    depends_on:
      coord-db:
        condition: service_healthy
      api-a1:
        condition: service_started
      api-a2:
        condition: service_started
      api-b1:
        condition: service_started
      api-b2:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pgdata-a:
  pgdata-b:
  pgdata-coord:

x-api-common: &api-common
  build: .
  env_file: .env
  volumes:
    - ./config:/app/config:ro
  healthcheck:
    test:
      - CMD
      - python
      - -c
      - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 10s

services:
  # ---------------------------------------------------------------------------
  # Shard A: accounts A0001-A1000, independent PostgreSQL instance.
  # ---------------------------------------------------------------------------
  db-a:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: banking_a
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata-a:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d banking_a"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot schema migration for shard A. Runs before the A replicas start.
  migrate-a:
    build: .
    command: ["python", "manage.py", "migrate", "--noinput"]
    env_file: .env
    environment:
      DB_HOST: db-a
      DB_NAME: banking_a
      SHARD_ID: shard-a
      REPLICA_ID: shard-a-migrate
    volumes:
      - ./config:/app/config:ro
    depends_on:
      db-a:
        condition: service_healthy

  api-a1:
    <<: *api-common
    environment:
      DB_HOST: db-a
      DB_NAME: banking_a
      SHARD_ID: shard-a
      REPLICA_ID: shard-a-1
    ports:
      - "8001:8000"
    depends_on:
      db-a:
        condition: service_healthy
      migrate-a:
        condition: service_completed_successfully

  api-a2:
    <<: *api-common
    environment:
      DB_HOST: db-a
      DB_NAME: banking_a
      SHARD_ID: shard-a
      REPLICA_ID: shard-a-2
    ports:
      - "8002:8000"
    depends_on:
      db-a:
        condition: service_healthy
      migrate-a:
        condition: service_completed_successfully

  # ---------------------------------------------------------------------------
  # Shard B: accounts A1001-A2000, independent PostgreSQL instance.
  # ---------------------------------------------------------------------------
  db-b:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: banking_b
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata-b:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d banking_b"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate-b:
    build: .
    command: ["python", "manage.py", "migrate", "--noinput"]
    env_file: .env
    environment:
      DB_HOST: db-b
      DB_NAME: banking_b
      SHARD_ID: shard-b
      REPLICA_ID: shard-b-migrate
    volumes:
      - ./config:/app/config:ro
    depends_on:
      db-b:
        condition: service_healthy

  api-b1:
    <<: *api-common
    environment:
      DB_HOST: db-b
      DB_NAME: banking_b
      SHARD_ID: shard-b
      REPLICA_ID: shard-b-1
    ports:
      - "8003:8000"
    depends_on:
      db-b:
        condition: service_healthy
      migrate-b:
        condition: service_completed_successfully

  api-b2:
    <<: *api-common
    environment:
      DB_HOST: db-b
      DB_NAME: banking_b
      SHARD_ID: shard-b
      REPLICA_ID: shard-b-2
    ports:
      - "8004:8000"
    depends_on:
      db-b:
        condition: service_healthy
      migrate-b:
        condition: service_completed_successfully

volumes:
  pgdata-a:
  pgdata-b:
